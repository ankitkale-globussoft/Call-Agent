<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Clinic AI Agent - Voice Test</title>
    <style>
        :root {
            --primary: #4f46e5;
            --primary-hover: #4338ca;
            --bg: #0f172a;
            --card-bg: #1e293b;
            --text: #f8fafc;
            --text-muted: #94a3b8;
            --accent: #10b981;
        }

        body {
            font-family: 'Inter', system-ui, -apple-system, sans-serif;
            background-color: var(--bg);
            color: var(--text);
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            margin: 0;
            overflow: hidden;
        }

        .container {
            width: 100%;
            max-width: 500px;
            padding: 2rem;
            background: var(--card-bg);
            border-radius: 1.5rem;
            box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.5);
            text-align: center;
            border: 1px solid rgba(255, 255, 255, 0.1);
            backdrop-filter: blur(10px);
        }

        h1 {
            font-size: 1.875rem;
            font-weight: 700;
            margin-bottom: 0.5rem;
            background: linear-gradient(to right, #818cf8, #c084fc);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        p {
            color: var(--text-muted);
            margin-bottom: 2rem;
        }

        .mic-button {
            width: 120px;
            height: 120px;
            border-radius: 50%;
            background: var(--primary);
            border: none;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            margin: 0 auto 2rem;
            transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
            box-shadow: 0 0 0 0 rgba(79, 70, 229, 0.4);
            position: relative;
        }

        .mic-button:hover {
            transform: scale(1.05);
            background: var(--primary-hover);
        }

        .mic-button.recording {
            background: #ef4444;
            animation: pulse 1.5s infinite;
        }

        @keyframes pulse {
            0% { box-shadow: 0 0 0 0 rgba(239, 68, 68, 0.7); }
            70% { box-shadow: 0 0 0 20px rgba(239, 68, 68, 0); }
            100% { box-shadow: 0 0 0 0 rgba(239, 68, 68, 0); }
        }

        .mic-icon {
            width: 48px;
            height: 48px;
            fill: white;
        }

        .status {
            margin-top: 1rem;
            font-size: 0.875rem;
            font-weight: 500;
            min-height: 1.25rem;
        }

        .chat-box {
            margin-top: 2rem;
            padding: 1rem;
            background: rgba(15, 23, 42, 0.5);
            border-radius: 0.75rem;
            text-align: left;
            max-height: 200px;
            overflow-y: auto;
            border: 1px solid rgba(255, 255, 255, 0.05);
        }

        .message {
            margin-bottom: 0.75rem;
            font-size: 0.9375rem;
            line-height: 1.4;
        }

        .user-text { color: var(--accent); font-weight: 600; }
        .ai-text { color: #818cf8; font-weight: 600; }

        .wave-container {
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 4px;
            height: 30px;
            margin-bottom: 1rem;
            visibility: hidden;
        }

        .wave-container.active {
            visibility: visible;
        }

        .bar {
            width: 4px;
            height: 10px;
            background: var(--primary);
            border-radius: 2px;
            animation: wave 1s ease-in-out infinite;
        }

        @keyframes wave {
            0%, 100% { height: 10px; }
            50% { height: 25px; }
        }

        .bar:nth-child(2) { animation-delay: 0.1s; }
        .bar:nth-child(3) { animation-delay: 0.2s; }
        .bar:nth-child(4) { animation-delay: 0.3s; }
        .bar:nth-child(5) { animation-delay: 0.4s; }
    </style>
</head>
<body>

    <div class="container">
        <h1>HealthFirst Clinic</h1>
        <p>Your AI Assistant is ready to help.</p>

        <div class="wave-container" id="wave">
            <div class="bar"></div>
            <div class="bar"></div>
            <div class="bar"></div>
            <div class="bar"></div>
            <div class="bar"></div>
        </div>

        <button id="micBtn" class="mic-button">
            <svg class="mic-icon" viewBox="0 0 24 24">
                <path d="M12 14c1.66 0 3-1.34 3-3V5c0-1.66-1.34-3-3-3S9 3.34 9 5v6c0 1.66 1.34 3 3 3z"/>
                <path d="M17 11c0 2.76-2.24 5-5 5s-5-2.24-5-5H5c0 3.53 2.61 6.43 6 6.92V21h2v-3.08c3.39-.49 6-3.39 6-6.92h-2z"/>
            </svg>
        </button>

        <div class="status" id="status">Click to start conversation</div>

        <div class="chat-box" id="chatBox">
            <div class="message">Welcome! How can I assist you today?</div>
        </div>
    </div>

    <script>
        const micBtn = document.getElementById('micBtn');
        const status = document.getElementById('status');
        const chatBox = document.getElementById('chatBox');
        const wave = document.getElementById('wave');

        let mediaRecorder;
        let audioChunks = [];
        let socket;
        let isRecording = false;

        // Initialize WebSocket
        function initSocket() {
            const protocol = window.location.protocol === 'https:' ? 'wss:' : 'ws:';
            socket = new WebSocket(`${protocol}//${window.location.host}/ws`);

            socket.onopen = () => {
                console.log('Connected to AI Server');
                status.innerText = "Connected. Click the mic to speak.";
            };

            socket.onmessage = async (event) => {
                if (typeof event.data === 'string') {
                    const msg = JSON.parse(event.data);
                    if (msg.type === 'transcription') {
                        addMessage('You', msg.text, 'user-text');
                    } else if (msg.type === 'response') {
                        addMessage('AI', msg.text, 'ai-text');
                    }
                } else {
                    // Binary audio data (AI Speech)
                    const audioBlob = new Blob([event.data], { type: 'audio/mpeg' });
                    const audioUrl = URL.createObjectURL(audioBlob);
                    const audio = new Audio(audioUrl);
                    status.innerText = "AI is speaking...";
                    audio.play();
                    audio.onended = () => {
                        status.innerText = "Ready. Click the mic to speak.";
                    };
                }
            };

            socket.onclose = () => {
                console.log('Disconnected');
                status.innerText = "Disconnected. Reconnecting...";
                setTimeout(initSocket, 3000);
            };
        }

        function addMessage(sender, text, className) {
            const div = document.createElement('div');
            div.className = 'message';
            div.innerHTML = `<span class="${className}">${sender}:</span> ${text}`;
            chatBox.appendChild(div);
            chatBox.scrollTop = chatBox.scrollHeight;
        }

        async function startRecording() {
            try {
                const stream = await navigator.mediaDevices.getUserMedia({ audio: true });
                mediaRecorder = new MediaRecorder(stream);
                audioChunks = [];

                mediaRecorder.ondataavailable = (event) => {
                    audioChunks.push(event.data);
                };

                mediaRecorder.onstop = () => {
                    const audioBlob = new Blob(audioChunks, { type: 'audio/wav' });
                    socket.send(audioBlob);
                    status.innerText = "Processing voice...";
                    wave.classList.remove('active');
                };

                mediaRecorder.start();
                isRecording = true;
                micBtn.classList.add('recording');
                status.innerText = "Listening...";
                wave.classList.add('active');
            } catch (err) {
                console.error('Error accessing microphone:', err);
                alert('Microphone access denied or error occurred.');
            }
        }

        function stopRecording() {
            if (mediaRecorder && isRecording) {
                mediaRecorder.stop();
                isRecording = false;
                micBtn.classList.remove('recording');
            }
        }

        micBtn.onclick = () => {
            if (!isRecording) {
                startRecording();
            } else {
                stopRecording();
            }
        };

        // Initialize on load
        initSocket();
    </script>
</body>
</html>
