<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Clinic AI Agent - Auto-VAD Test</title>
    <style>
        :root {
            --primary: #4f46e5;
            --primary-hover: #4338ca;
            --bg: #0f172a;
            --card-bg: #1e293b;
            --text: #f8fafc;
            --text-muted: #94a3b8;
            --accent: #10b981;
        }

        body {
            font-family: 'Inter', system-ui, -apple-system, sans-serif;
            background-color: var(--bg);
            color: var(--text);
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            margin: 0;
            overflow: hidden;
        }

        .container {
            width: 100%;
            max-width: 500px;
            padding: 2.5rem;
            background: var(--card-bg);
            border-radius: 2rem;
            box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.5);
            text-align: center;
            border: 1px solid rgba(255, 255, 255, 0.1);
            backdrop-filter: blur(12px);
        }

        h1 {
            font-size: 2rem;
            font-weight: 800;
            margin-bottom: 0.5rem;
            background: linear-gradient(to right, #818cf8, #c084fc);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        .status-badge {
            display: inline-block;
            padding: 0.25rem 0.75rem;
            border-radius: 9999px;
            font-size: 0.75rem;
            font-weight: 600;
            text-transform: uppercase;
            margin-bottom: 2rem;
            background: rgba(255, 255, 255, 0.1);
        }

        .status-badge.active { background: rgba(16, 185, 129, 0.2); color: var(--accent); }
        .status-badge.waiting { background: rgba(245, 158, 11, 0.2); color: #f59e0b; }

        .mic-container {
            position: relative;
            margin-bottom: 2rem;
        }

        .mic-button {
            width: 140px;
            height: 140px;
            border-radius: 50%;
            background: var(--primary);
            border: none;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            margin: 0 auto;
            transition: all 0.4s cubic-bezier(0.4, 0, 0.2, 1);
            box-shadow: 0 0 0 0 rgba(79, 70, 229, 0.4);
            z-index: 10;
        }

        .mic-button.active {
            background: #10b981;
            box-shadow: 0 0 40px rgba(16, 185, 129, 0.4);
        }

        .mic-button.disabled {
            background: #475569;
            cursor: not-allowed;
            opacity: 0.7;
        }

        .mic-icon { width: 56px; height: 56px; fill: white; }

        .wave-box {
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 6px;
            height: 40px;
            margin-top: 1rem;
        }

        .bar {
            width: 5px;
            height: 10px;
            background: var(--primary);
            border-radius: 3px;
            transition: height 0.1s ease;
        }

        .chat-box {
            margin-top: 2rem;
            padding: 1.5rem;
            background: rgba(15, 23, 42, 0.4);
            border-radius: 1rem;
            text-align: left;
            max-height: 250px;
            overflow-y: auto;
            border: 1px solid rgba(255, 255, 255, 0.05);
            font-size: 0.9375rem;
        }

        .message { margin-bottom: 1rem; line-height: 1.5; }
        .user-label { color: var(--accent); font-weight: 700; margin-right: 0.5rem; }
        .ai-label { color: #818cf8; font-weight: 700; margin-right: 0.5rem; }
        .thinking-label { color: #f59e0b; font-weight: 700; margin-right: 0.5rem; }
        .thinking-msg { opacity: 0.75; font-style: italic; }

        .thinking-dots { display: inline-flex; gap: 4px; vertical-align: middle; margin-left: 4px; }
        .thinking-dots span {
            width: 6px; height: 6px; border-radius: 50%;
            background: #f59e0b;
            animation: bounce 1.2s infinite;
        }
        .thinking-dots span:nth-child(2) { animation-delay: 0.2s; }
        .thinking-dots span:nth-child(3) { animation-delay: 0.4s; }
        @keyframes bounce {
            0%, 80%, 100% { transform: scale(0); opacity: 0.3; }
            40% { transform: scale(1); opacity: 1; }
        }

        .hint {
            margin-top: 1rem;
            font-size: 0.8rem;
            color: var(--text-muted);
        }
    </style>
</head>
<body>

    <div class="container">
        <h1>HealthFirst AI</h1>
        <div id="statusBadge" class="status-badge waiting">Initializing...</div>

        <div class="mic-container">
            <button id="startBtn" class="mic-button">
                <svg class="mic-icon" viewBox="0 0 24 24">
                    <path d="M12 14c1.66 0 3-1.34 3-3V5c0-1.66-1.34-3-3-3S9 3.34 9 5v6c0 1.66 1.34 3 3 3z"/>
                    <path d="M17 11c0 2.76-2.24 5-5 5s-5-2.24-5-5H5c0 3.53 2.61 6.43 6 6.92V21h2v-3.08c3.39-.49 6-3.39 6-6.92h-2z"/>
                </svg>
            </button>
        </div>

        <div class="wave-box" id="waveBox">
            <div class="bar"></div>
            <div class="bar"></div>
            <div class="bar"></div>
            <div class="bar"></div>
            <div class="bar"></div>
            <div class="bar"></div>
            <div class="bar"></div>
        </div>

        <div class="chat-box" id="chatBox">
            <div class="message"><span class="ai-label">AI:</span> Hello! I'm your clinic assistant. Just start talking, and I'll listen.</div>
        </div>

        <div class="hint">Auto-VAD enabled. No need to stop manually.</div>
    </div>

    <script>
        const startBtn = document.getElementById('startBtn');
        const statusBadge = document.getElementById('statusBadge');
        const chatBox = document.getElementById('chatBox');
        const waveBars = document.querySelectorAll('.bar');

        let audioContext;
        let processor;
        let source;
        let socket;
        let isActive = false;
        let isAISpeaking = false;

        async function initStream() {
            try {
                const stream = await navigator.mediaDevices.getUserMedia({ audio: true });
                audioContext = new AudioContext({ sampleRate: 16000 });
                source = audioContext.createMediaStreamSource(stream);
                
                // ScriptProcessor for compatibility and ease of use in prototype
                processor = audioContext.createScriptProcessor(4096, 1, 1);

                processor.onaudioprocess = (e) => {
                    if (!isActive || isAISpeaking) return;

                    const inputData = e.inputBuffer.getChannelData(0);
                    // Visualize
                    const volume = Math.max(...inputData);
                    updateWave(volume);

                    // Convert to Int16 PCM
                    const pcmData = new Int16Array(inputData.length);
                    for (let i = 0; i < inputData.length; i++) {
                        pcmData[i] = Math.max(-1, Math.min(1, inputData[i])) * 0x7FFF;
                    }
                    
                    if (socket && socket.readyState === WebSocket.OPEN) {
                        socket.send(pcmData.buffer);
                    }
                };

                source.connect(processor);
                processor.connect(audioContext.destination);
                
                statusBadge.innerText = "Ready to Talk";
                statusBadge.className = "status-badge active";
            } catch (err) {
                console.error("Mic error:", err);
                statusBadge.innerText = "Mic Access Denied";
            }
        }

        function updateWave(volume) {
            waveBars.forEach((bar, i) => {
                const height = 10 + (volume * 100 * (1 - Math.abs(i - 3) / 4));
                bar.style.height = `${Math.min(height, 40)}px`;
            });
        }

        function initSocket() {
            const protocol = window.location.protocol === 'https:' ? 'wss:' : 'ws:';
            socket = new WebSocket(`${protocol}//${window.location.host}/ws`);

            let thinkingEl = null;

            socket.onmessage = async (event) => {
                if (typeof event.data === 'string') {
                    const msg = JSON.parse(event.data);

                    if (msg.type === 'transcription') {
                        addMessage('You', msg.text, 'user-label');

                    } else if (msg.type === 'thinking') {
                        // Update or create the thinking indicator
                        statusBadge.innerText = "Aria is thinking...";
                        statusBadge.className = "status-badge waiting";
                        if (!thinkingEl) {
                            thinkingEl = document.createElement('div');
                            thinkingEl.className = 'message thinking-msg';
                            thinkingEl.innerHTML = `<span class="thinking-label">Aria:</span> ${msg.text}<span class="thinking-dots"><span></span><span></span><span></span></span>`;
                            chatBox.appendChild(thinkingEl);
                            chatBox.scrollTop = chatBox.scrollHeight;
                        } else {
                            thinkingEl.innerHTML = `<span class="thinking-label">Aria:</span> ${msg.text}<span class="thinking-dots"><span></span><span></span><span></span></span>`;
                        }

                    } else if (msg.type === 'response') {
                        // Remove thinking bubble, add real response
                        if (thinkingEl) { thinkingEl.remove(); thinkingEl = null; }
                        statusBadge.innerText = "Responding...";
                        addMessage('Aria', msg.text, 'ai-label');
                    }

                } else {
                    // Binary audio response
                    isAISpeaking = true;
                    statusBadge.innerText = "Aria is Speaking...";
                    statusBadge.className = "status-badge waiting";

                    const audioBlob = new Blob([event.data], { type: 'audio/mpeg' });
                    const audio = new Audio(URL.createObjectURL(audioBlob));
                    audio.play();
                    audio.onended = () => {
                        isAISpeaking = false;
                        statusBadge.innerText = "Listening...";
                        statusBadge.className = "status-badge active";
                    };
                }
            };

            socket.onopen = () => {
                console.log("Connected");
            };
        }

        function addMessage(sender, text, labelClass) {
            const div = document.createElement('div');
            div.className = 'message';
            div.innerHTML = `<span class="${labelClass}">${sender}:</span> ${text}`;
            chatBox.appendChild(div);
            chatBox.scrollTop = chatBox.scrollHeight;
        }

        startBtn.onclick = () => {
            if (!audioContext) {
                initStream();
                initSocket();
                isActive = true;
                startBtn.classList.add('active');
                statusBadge.innerText = "Listening...";
                statusBadge.className = "status-badge active";
            } else {
                // Toggle
                isActive = !isActive;
                startBtn.classList.toggle('active');
                statusBadge.innerText = isActive ? "Listening..." : "Paused";
            }
        };
    </script>
</body>
</html>
